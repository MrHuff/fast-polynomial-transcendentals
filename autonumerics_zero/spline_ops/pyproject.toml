[build-system]
requires = [
  "setuptools>=77",
  "torch>=2.5",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "sfu-spline-ops"
version = "0.1.0"
description = "CUDA spline transcendental operators used by the SFU experiments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Robert Hu", email = "robert.stats.hu@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.5",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/MrHuff/fast-polynomial-transcendentals"

[tool.setuptools]
py-modules = ["spline_compile"]
