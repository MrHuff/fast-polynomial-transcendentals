# Public B5 control: Llama 8B-shaped probe with all exp2 lanes on the SFU path.
# The selected D3 backend is inactive because both route frequencies are zero.
[job]
dump_folder = "./outputs/torchtitan/b5/native"
description = "B5 all-SFU exp2 control (d3:0:0)"
custom_config_module = "sfu_repro.torchtitan.config"

[experimental]
custom_import = "sfu_repro.torchtitan.plugin"

[profiling]
enable_profiling = false

[metrics]
log_freq = 1
enable_tensorboard = true
save_tb_folder = "tb"
enable_wandb = false

[model]
name = "sfu_llama3"
flavor = "8B"
hf_assets_path = "./assets/hf/Llama-3.1-8B"
converters = ["sfu_repro"]

[optimizer]
name = "AdamW"
lr = 0.000244140625
beta1 = 0.9
beta2 = 0.95
eps = 1e-8
weight_decay = 0.1
implementation = "fused"

[lr_scheduler]
warmup_steps = 2000
total_steps = 80
decay_type = "cosine"
min_lr_factor = 0.01

[training]
dataset = "c4_test"
dataset_path = "./torchtitan/tests/assets/c4_test"
local_batch_size = 1
global_batch_size = 1
seq_len = 4096
max_norm = 1.0
steps = 80
dtype = "bfloat16"
mixed_precision_param = "bfloat16"

[parallelism]
data_parallel_replicate_degree = 1
data_parallel_shard_degree = -1
tensor_parallel_degree = 1
pipeline_parallel_degree = 1
context_parallel_degree = 1

[checkpoint]
enable = false
folder = "checkpoint"
interval = 80
last_save_model_only = false
export_dtype = "float32"
async_mode = "disabled"

[compile]
enable = false
components = ["model", "loss"]

[activation_checkpoint]
mode = "none"

[validation]
enable = false
dataset = "c4_test"
local_batch_size = 1
seq_len = 4096
freq = 80
steps = 1

[debug]
seed = 1234

[sfu]
case = "b5"
variant = "native"
strict = true
