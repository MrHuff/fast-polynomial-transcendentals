[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfu-repro"
version = "0.1.0"
description = "Standalone reproduction plumbing for fast polynomial transcendental functions in LLMs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Robert Hu", email = "robert.stats.hu@gmail.com" },
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
]
eval = [
  "lm-eval>=0.4.8",
  "transformers>=4.55",
]
test = [
  "pytest>=8.0",
]

[project.scripts]
sfu-doctor = "sfu_repro.doctor:main"
sfu-validate = "sfu_repro.artifact:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
